name: Validate HealthConnect

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: healthconnect-api
    env:
      DATABASE_URL: postgresql://healthconnect:healthconnect@localhost:5432/healthconnect
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: healthconnect-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build API
        run: npm run build

      - name: Audit runtime dependencies
        shell: bash
        run: |
          audit_with_retry() {
            local label="$1"
            shift
            local output
            output="$(mktemp)"

            for attempt in 1 2 3; do
              echo "${label}: attempt ${attempt}/3"
              set +e
              npm audit "$@" --json >"$output" 2>&1
              rc=$?
              set -e
              cat "$output"

              if [ "$rc" -eq 0 ]; then
                rm -f "$output"
                return 0
              fi

              # A normal npm security finding contains vulnerability metadata.
              # Preserve that as a real CI failure.
              if grep -q '"vulnerabilities"' "$output"; then
                rm -f "$output"
                return "$rc"
              fi

              # npm's audit service has intermittently returned 400/503 and
              # invalid-response errors even after a successful npm ci.
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 5))
              fi
            done

            echo "::warning::${label} could not complete because the npm audit service returned an invalid/unavailable response after 3 attempts. Install and build validation already passed, so CI will continue."
            rm -f "$output"
            return 0
          }

          audit_with_retry "API runtime audit" --omit=dev --audit-level=moderate

      - name: Audit full dependency tree
        shell: bash
        run: |
          audit_with_retry() {
            local label="$1"
            shift
            local output
            output="$(mktemp)"

            for attempt in 1 2 3; do
              echo "${label}: attempt ${attempt}/3"
              set +e
              npm audit "$@" --json >"$output" 2>&1
              rc=$?
              set -e
              cat "$output"

              if [ "$rc" -eq 0 ]; then
                rm -f "$output"
                return 0
              fi

              if grep -q '"vulnerabilities"' "$output"; then
                rm -f "$output"
                return "$rc"
              fi

              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 5))
              fi
            done

            echo "::warning::${label} could not complete because the npm audit service returned an invalid/unavailable response after 3 attempts. Install and build validation already passed, so CI will continue."
            rm -f "$output"
            return 0
          }

          audit_with_retry "API full audit" --audit-level=high

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: healthconnect-web
    env:
      NEXT_PUBLIC_API_URL: https://api.healthconnect.sbs/api/v1
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: healthconnect-web/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev

      # Build must validate the application independently of npm's remote
      # security-audit service availability.
      - name: Build web
        run: npm run build

      - name: Audit runtime dependencies
        shell: bash
        run: |
          audit_with_retry() {
            local label="$1"
            shift
            local output
            output="$(mktemp)"

            for attempt in 1 2 3; do
              echo "${label}: attempt ${attempt}/3"
              set +e
              npm audit "$@" --json >"$output" 2>&1
              rc=$?
              set -e
              cat "$output"

              if [ "$rc" -eq 0 ]; then
                rm -f "$output"
                return 0
              fi

              # Real vulnerability results remain blocking.
              if grep -q '"vulnerabilities"' "$output"; then
                rm -f "$output"
                return "$rc"
              fi

              # Transient npm audit endpoint failures are retried and then
              # downgraded to a warning because npm ci + next build passed.
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 5))
              fi
            done

            echo "::warning::${label} could not complete because the npm audit service returned an invalid/unavailable response after 3 attempts. Install and build validation already passed, so CI will continue."
            rm -f "$output"
            return 0
          }

          audit_with_retry "Web runtime audit" --omit=dev --audit-level=moderate

      - name: Audit full dependency tree
        shell: bash
        run: |
          audit_with_retry() {
            local label="$1"
            shift
            local output
            output="$(mktemp)"

            for attempt in 1 2 3; do
              echo "${label}: attempt ${attempt}/3"
              set +e
              npm audit "$@" --json >"$output" 2>&1
              rc=$?
              set -e
              cat "$output"

              if [ "$rc" -eq 0 ]; then
                rm -f "$output"
                return 0
              fi

              if grep -q '"vulnerabilities"' "$output"; then
                rm -f "$output"
                return "$rc"
              fi

              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 5))
              fi
            done

            echo "::warning::${label} could not complete because the npm audit service returned an invalid/unavailable response after 3 attempts. Install and build validation already passed, so CI will continue."
            rm -f "$output"
            return 0
          }

          audit_with_retry "Web full audit" --audit-level=high
