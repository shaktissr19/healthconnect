name: Validate HealthConnect

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  api-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: healthconnect-api
    env:
      DATABASE_URL: postgresql://healthconnect:healthconnect@localhost:5432/healthconnect
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: healthconnect-api/package-lock.json
      - run: npm ci
      - name: Audit runtime dependencies
        continue-on-error: true
        run: npm audit --omit=dev
      - name: Audit complete dependency tree
        continue-on-error: true
        run: npm audit
      - run: npx prisma generate
      - run: npm run build

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: healthconnect-web
    env:
      NEXT_PUBLIC_API_URL: https://api.healthconnect.sbs/api/v1
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: healthconnect-web/package-lock.json
      - run: npm ci
      - name: Audit runtime dependencies
        continue-on-error: true
        run: npm audit --omit=dev
      - name: Audit complete dependency tree
        continue-on-error: true
        run: npm audit
      - run: npm run build
