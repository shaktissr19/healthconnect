name: Refresh Security Locks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-security-locks.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh web dependency locks
        working-directory: healthconnect-web
        run: |
          npm install --package-lock-only --ignore-scripts next@16.3.4 eslint-config-next@16.3.4
          npm update --package-lock-only --ignore-scripts sharp
          node - <<'NODE'
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          const sharp = lock.packages?.['node_modules/sharp']?.version;
          if (pkg.dependencies?.next !== '16.3.4') throw new Error(`next=${pkg.dependencies?.next}`);
          if (pkg.devDependencies?.['eslint-config-next'] !== '16.3.4') throw new Error(`eslint-config-next=${pkg.devDependencies?.['eslint-config-next']}`);
          if (sharp !== '0.35.4') throw new Error(`sharp=${sharp}`);
          console.log('Web patches verified:', {next: pkg.dependencies.next, eslintConfigNext: pkg.devDependencies['eslint-config-next'], sharp});
          NODE

      - name: Refresh API dependency locks
        working-directory: healthconnect-api
        run: |
          npm install --package-lock-only --ignore-scripts morgan@1.12.0 multer@2.3.0
          node - <<'NODE'
          const pkg = require('./package.json');
          if (pkg.dependencies?.morgan !== '1.12.0') throw new Error(`morgan=${pkg.dependencies?.morgan}`);
          if (pkg.dependencies?.multer !== '2.3.0') throw new Error(`multer=${pkg.dependencies?.multer}`);
          console.log('API patches verified:', {morgan: pkg.dependencies.morgan, multer: pkg.dependencies.multer});
          NODE

      - name: Commit refreshed locks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add healthconnect-web/package.json healthconnect-web/package-lock.json healthconnect-api/package.json healthconnect-api/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes required."
            exit 0
          fi
          git commit -m "Patch production dependency advisories"
          git push origin HEAD:main
